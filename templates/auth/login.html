{% extends "base.html" %}

{% block title %}Sign In - AI Urban Farming Assistant{% endblock %}

{% block content %}
<div class="min-h-[75vh] flex items-center justify-center py-8">
    <div class="max-w-md w-full bg-white rounded-2xl shadow-xl border border-slate-100 overflow-hidden">
        <!-- Card Header -->
        <div class="bg-gradient-to-r from-forest-800 to-forest-700 px-8 py-8 text-center text-white relative">
            <div class="w-14 h-14 bg-white/10 rounded-2xl flex items-center justify-center mx-auto mb-3 backdrop-blur-sm border border-white/20">
                <i class="fa-solid fa-seedling text-3xl text-emerald-300"></i>
            </div>
            <h2 class="text-2xl font-bold tracking-tight">Urban Farmer Sign In</h2>
            <p class="text-xs text-forest-200 mt-1">Access your plants, AI leaf diagnoses & watering schedule</p>
        </div>

        <!-- Form Body -->
        <div class="p-8">
            <form method="POST" action="{{ url_for('login') }}" class="space-y-5">
                {% if next %}
                <input type="hidden" name="next" value="{{ next }}">
                {% endif %}

                <div>
                    <label for="login_id" class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1.5">
                        Username or Email
                    </label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-400">
                            <i class="fa-solid fa-user"></i>
                        </span>
                        <input type="text" id="login_id" name="login_id" value="{{ login_id or '' }}" required autofocus
                            placeholder="e.g. greenfarmer or grower@urban.farm"
                            class="w-full pl-10 pr-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-forest-600 focus:bg-white transition">
                    </div>
                </div>

                <div>
                    <div class="flex items-center justify-between mb-1.5">
                        <label for="password" class="block text-xs font-semibold text-slate-700 uppercase tracking-wider">
                            Password
                        </label>
                    </div>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-400">
                            <i class="fa-solid fa-lock"></i>
                        </span>
                        <input type="password" id="password" name="password" required
                            placeholder="Enter your password"
                            class="w-full pl-10 pr-10 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-forest-600 focus:bg-white transition">
                        <button type="button" onclick="togglePasswordVisibility('password', this)" class="absolute inset-y-0 right-0 flex items-center pr-3.5 text-slate-400 hover:text-slate-600">
                            <i class="fa-solid fa-eye"></i>
                        </button>
                    </div>
                </div>

                <button type="submit"
                    class="w-full py-3 px-4 bg-forest-600 hover:bg-forest-700 text-white font-semibold rounded-xl text-sm shadow-md hover:shadow-lg transition-all duration-200 flex items-center justify-center space-x-2">
                    <i class="fa-solid fa-arrow-right-to-bracket"></i>
                    <span>Log In to Dashboard</span>
                </button>
            </form>

            <div class="mt-6 pt-6 border-t border-slate-100 text-center text-sm text-slate-600">
                New to Urban Farming Assistant?
                <a href="{{ url_for('register') }}" class="font-semibold text-forest-700 hover:text-forest-800 underline ml-1">
                    Create an account
                </a>
            </div>
        </div>
    </div>
</div>

<script>
    function togglePasswordVisibility(fieldId, btn) {
        const input = document.getElementById(fieldId);
        const icon = btn.querySelector('i');
        if (input.type === 'password') {
            input.type = 'text';
            icon.classList.remove('fa-eye');
            icon.classList.add('fa-eye-slash');
        } else {
            input.type = 'password';
            icon.classList.remove('fa-eye-slash');
            icon.classList.add('fa-eye');
        }
    }
</script>
{% endblock %}
